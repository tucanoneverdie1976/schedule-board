<!doctype html>
<html lang="ko" translate="no" class="notranslate">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google" content="notranslate" />
    <title>오늘 일정</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260611-cursor-hide" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Porcupine Schedule</p>
          <h1 id="pageTitle">오늘 일정</h1>
        </div>
        <div class="status-strip" aria-live="polite">
          <span id="apiStatus" class="status-dot"></span>
          <span id="statusText">연결 확인 중</span>
        </div>
      </header>

      <section class="layout">
        <section class="board">
          <div id="scheduleList" class="schedule-list"></div>
        </section>

        <section class="info-column">
          <section class="news-section">
            <div class="news-head">
              <div>
                <p class="eyebrow">News Feed</p>
                <h2>최신 뉴스</h2>
              </div>
              <span id="newsUpdatedText" class="news-updated">불러오는 중</span>
            </div>
            <div id="newsList" class="news-list"></div>
          </section>

          <section class="weather-section">
            <div class="weather-head">
              <div>
                <p class="eyebrow">Weather</p>
                <h2>대전 일기예보</h2>
              </div>
              <span id="weatherUpdatedText" class="weather-updated">불러오는 중</span>
            </div>
            <div id="weatherPanel" class="weather-panel"></div>
          </section>

          <section class="market-section">
            <div class="market-head">
              <div>
                <p class="eyebrow">Market</p>
                <h2>시장 현황</h2>
              </div>
              <span id="marketUpdatedText" class="market-updated">불러오는 중</span>
            </div>
            <div id="marketList" class="market-list"></div>
          </section>
        </section>

        <aside class="art-panel" aria-hidden="true">
          <img id="artImage" alt="" />
          <div class="art-caption">
            <strong id="artTitle"></strong>
            <span id="artArtist"></span>
          </div>
        </aside>
      </section>
    </main>

    <template id="scheduleTemplate">
      <article class="schedule-card">
        <div class="card-main">
          <span class="schedule-number"></span>
          <div class="card-copy">
            <div class="card-time"></div>
            <h3></h3>
            <p class="card-notes"></p>
          </div>
        </div>
      </article>
    </template>

    <template id="newsTemplate">
      <article class="news-card">
        <a class="news-title" href="#" target="_blank" rel="noopener noreferrer"></a>
        <div class="news-meta"></div>
      </article>
    </template>

    <template id="weatherTemplate">
      <article class="weather-card">
        <div class="weather-day"></div>
        <div class="weather-summary"></div>
        <div class="weather-temps"></div>
        <div class="weather-rain"></div>
      </article>
    </template>

    <template id="marketTemplate">
      <article class="market-card">
        <div class="market-card-head">
          <span class="market-name"></span>
          <span class="market-status"></span>
        </div>
        <div class="market-value-row">
          <strong class="market-value"></strong>
          <span class="market-unit"></span>
        </div>
        <div class="market-change"></div>
        <div class="market-meta"></div>
      </article>
    </template>

    <script src="/static/app.js?v=20260611-cursor-hide"></script>
  </body>
</html>
