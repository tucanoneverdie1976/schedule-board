<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>일정 게시판</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Porcupine Schedule</p>
          <h1>일정 게시판</h1>
        </div>
        <div class="status-strip" aria-live="polite">
          <span id="apiStatus" class="status-dot"></span>
          <span id="statusText">연결 확인 중</span>
        </div>
      </header>

      <section class="layout">
        <section class="board">
          <div class="board-head">
            <div>
              <p class="eyebrow" id="todayLabel">오늘</p>
              <h2 id="boardTitle">전체 일정</h2>
            </div>
            <div class="filters" role="tablist" aria-label="일정 필터">
              <button class="filter-button active" data-range="today" type="button">오늘</button>
              <button class="filter-button" data-range="week" type="button">이번 주</button>
              <button class="filter-button" data-range="all" type="button">전체</button>
            </div>
          </div>

          <div class="summary-row" aria-live="polite">
            <div>
              <strong id="totalCount">0</strong>
              <span>개 일정</span>
            </div>
            <div>
              <strong id="openCount">0</strong>
              <span>개 진행 중</span>
            </div>
            <button id="refreshButton" class="ghost-button" type="button">새로고침</button>
          </div>

          <div id="scheduleList" class="schedule-list"></div>
        </section>

        <section class="news-section">
          <div class="news-head">
            <div>
              <p class="eyebrow">News Feed</p>
              <h2>최신 뉴스</h2>
            </div>
            <span id="newsUpdatedText" class="news-updated">불러오는 중</span>
          </div>
          <div id="newsList" class="news-list"></div>
        </section>

        <section class="market-section">
          <div class="market-head">
            <div>
              <p class="eyebrow">Market</p>
              <h2>시장 현황</h2>
            </div>
            <span id="marketUpdatedText" class="market-updated">불러오는 중</span>
          </div>
          <div id="marketList" class="market-list"></div>
        </section>
      </section>
    </main>

    <template id="scheduleTemplate">
      <article class="schedule-card">
        <div class="card-main">
          <button class="done-toggle" type="button" title="완료 전환" aria-label="완료 전환"></button>
          <div class="card-copy">
            <div class="card-time"></div>
            <h3></h3>
            <p class="card-notes"></p>
          </div>
        </div>
        <div class="card-actions">
          <button class="delete-button" type="button">삭제</button>
        </div>
      </article>
    </template>

    <template id="newsTemplate">
      <article class="news-card">
        <a class="news-title" href="#" target="_blank" rel="noopener noreferrer"></a>
        <div class="news-meta"></div>
      </article>
    </template>

    <template id="marketTemplate">
      <article class="market-card">
        <div class="market-card-head">
          <span class="market-name"></span>
          <span class="market-status"></span>
        </div>
        <div class="market-value-row">
          <strong class="market-value"></strong>
          <span class="market-unit"></span>
        </div>
        <div class="market-change"></div>
        <div class="market-meta"></div>
      </article>
    </template>

    <script src="/static/app.js"></script>
  </body>
</html>
